server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: railsync-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/railsync_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

railsync:
  algorithm:
    max-trace-steps: 500

logging:
  level:
    root: INFO
    com.railsync: DEBUG
